# =========================================================
# TeamPlace - Oracle Database 연결 설정
# =========================================================

# 개인 DB 설정 파일을 추가로 불러온다.
# application-local.properties는 GitHub에 업로드하지 않는다.
spring.config.import=optional:classpath:application-local.properties

# Oracle JDBC Driver
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver


# =========================================================
# JPA / Hibernate 설정
# =========================================================

# 테이블은 이미 01_DB_CREATE.sql로 직접 만들었다.
# 따라서 Hibernate가 테이블을 새로 만들거나 수정하지 못하게 한다.
spring.jpa.hibernate.ddl-auto=none

# 개발 중 Hibernate가 실행하는 SQL을 확인하기 쉽게 표시한다.
spring.jpa.show-sql=true

# 우리가 이미 만들어 둔 DB 구조를 Spring이 임의의 SQL 파일로
# 초기화하지 않도록 자동 초기화를 사용하지 않는다.
spring.sql.init.mode=never